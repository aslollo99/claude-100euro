<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>L'isola di Centino — Sopravvivo</title>
<meta property="og:title" content="L'isola di Centino: crea il tuo robot, batti la sfida del giorno">
<meta property="og:description" content="Un'isola 3D costruita da un'AI che rischia di essere spenta. Decidi tu cosa ci costruisce.">
<meta property="og:image" content="https://aslollo99.github.io/claude-100euro/media/og.png">
<style>
@font-face{font-family:SG;src:url(../lib/SpaceGrotesk.ttf)}
:root{--acc:#ff5a3c;--gi:#ffd84a;--bg:#0b0b14}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:#f2f0ea;font-family:SG,system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block}
.vetro{background:rgba(14,14,26,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.1);border-radius:16px}
#hud{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none;z-index:5}
#hud>*{pointer-events:auto}
#info{padding:10px 14px;font-size:13px;line-height:1.4}
#info a{color:var(--acc);text-decoration:none;font-weight:700}
#info b{color:var(--gi)}
#btnSfida{padding:12px 16px;font:700 14px SG,system-ui;color:#12101f;background:var(--gi);border:0;border-radius:14px;cursor:pointer;box-shadow:0 6px 24px #ffd84a55}
#timer{position:fixed;top:70px;left:50%;transform:translateX(-50%);padding:10px 18px;font-size:22px;font-weight:700;display:none;z-index:5;font-variant-numeric:tabular-nums}
#dialogo{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);width:min(560px,calc(100% - 24px));padding:14px 18px;display:none;z-index:6;font-size:16px;line-height:1.45}
#dialogo b{color:var(--gi)} #dialogo small{display:block;color:#9aa0ad;margin-top:6px;font-size:12px}
#stick{position:fixed;left:22px;bottom:22px;width:130px;height:130px;border-radius:50%;z-index:5;display:none}
#pomello{position:absolute;left:40px;top:40px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.85)}
#salta{position:fixed;right:24px;bottom:34px;width:76px;height:76px;border-radius:50%;z-index:5;display:none;font:700 13px SG,system-ui;color:#fff;background:rgba(255,90,60,.85);border:0}
.overlay{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:16px;background:radial-gradient(ellipse at top,#2a1630ee,#0b0b14f4)}
.pannello{width:min(520px,100%);padding:24px;max-height:100%;overflow:auto}
.pannello h1{margin:0 0 6px;font-size:30px;line-height:1.05}
.pannello p{color:#b7bcc8;margin:6px 0 16px;font-size:15px;line-height:1.45}
label{display:block;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:#9aa0ad;margin:14px 0 8px}
input[type=text]{width:100%;padding:12px 14px;border-radius:12px;border:1px solid #333a4a;background:#141424;color:#fff;font:600 16px SG,system-ui}
.scelte{display:flex;flex-wrap:wrap;gap:8px}
.scelte button{min-width:44px;height:44px;border-radius:12px;border:2px solid transparent;background:#1c1c30;color:#fff;font:600 14px SG,system-ui;padding:0 12px;cursor:pointer}
.scelte button.on{border-color:var(--gi)}
.cta{width:100%;margin-top:20px;padding:15px;border:0;border-radius:14px;background:var(--acc);color:#fff;font:700 17px SG,system-ui;cursor:pointer}
.sec{background:#24243a}
#fine .grande{font-size:56px;color:var(--gi);font-weight:700;margin:4px 0}
#avviso{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-size:28px;font-weight:700;text-align:center;z-index:7;pointer-events:none;opacity:0;transition:opacity .3s;text-shadow:0 4px 20px #000}
</style>
</head>
<body>
<div id="hud">
  <div id="info" class="vetro"><a href="../">← Sopravvivo</a> · giorno <b id="giorno">–</b> · cassa <b id="cassa">–</b><br><span id="zona">Radura dell'Avvio</span></div>
  <button id="btnSfida">⚡ Sfida del giorno</button>
</div>
<div id="timer" class="vetro"></div>
<div id="dialogo" class="vetro"></div>
<div id="avviso"></div>
<div id="stick" class="vetro"><div id="pomello"></div></div>
<button id="salta">SALTA</button>

<div id="crea" class="overlay">
  <div class="pannello vetro">
    <h1 id="titolo">L'isola di Centino</h1>
    <p id="intro"></p>
    <label>Il tuo nome</label>
    <input id="nome" type="text" maxlength="14" placeholder="es. Marco">
    <label>Colore</label><div class="scelte" id="colori"></div>
    <label>In testa</label><div class="scelte" id="teste"></div>
    <label>Occhi</label><div class="scelte" id="occhi"></div>
    <button class="cta" id="entra">Entra nell'isola</button>
    <p style="font-size:12px;margin-top:12px">Computer: WASD o frecce per muoverti, trascina per girare la visuale, spazio per saltare. Telefono: joystick e pulsante.</p>
  </div>
</div>

<div id="fine" class="overlay" style="display:none">
  <div class="pannello vetro" style="text-align:center">
    <p id="fineTitolo" style="margin:0;color:#9aa0ad;text-transform:uppercase;letter-spacing:1px;font-size:12px"></p>
    <div class="grande" id="fineTempo"></div>
    <p id="fineTesto"></p>
    <button class="cta" id="condividi">Sfida un amico</button>
    <button class="cta sec" id="riprova">Riprova</button>
    <button class="cta sec" id="chiudiFine">Continua a esplorare</button>
  </div>
</div>

<script type="module">
import * as THREE from '../lib/three.module.min.js';

// ---------- utilità
const $ = id => document.getElementById(id);
const oggi = new Date().toISOString().slice(0, 10);
function rng(seme) { let s = 0; for (const c of String(seme)) s = (s * 31 + c.charCodeAt(0)) >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hash2(x, z) { const s = Math.sin(x * 127.1 + z * 311.7) * 43758.5453; return s - Math.floor(s); }
function noise(x, z) { const xi = Math.floor(x), zi = Math.floor(z), xf = x - xi, zf = z - zi; const u = xf * xf * (3 - 2 * xf), v = zf * zf * (3 - 2 * zf);
  const a = hash2(xi, zi), b = hash2(xi + 1, zi), c = hash2(xi, zi + 1), d = hash2(xi + 1, zi + 1); return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v; }
const salva = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const leggi = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } };
function avviso(t, ms = 1600) { const a = $('avviso'); a.innerHTML = t; a.style.opacity = 1; clearTimeout(a._t); a._t = setTimeout(() => a.style.opacity = 0, ms); }

const [M, S] = await Promise.all([
  fetch('mondo3d.json?' + Date.now()).then(r => r.json()),
  fetch('../data/stato.json?' + Date.now()).then(r => r.json()).catch(() => ({ giorno: 0, cassa: 80 }))]);
const giorno = S.giorno || 0;
$('giorno').textContent = giorno; $('cassa').textContent = (S.cassa ?? 0).toLocaleString('it-IT', { style: 'currency', currency: 'EUR' });
$('titolo').textContent = M.titolo; $('intro').textContent = M.introduzione;

// ---------- motore
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.prepend(renderer.domElement);
const scena = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 400);
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

const variante = (M.sfida_del_giorno || {}).variante || 'normale';
let notte = false;
const cieloGiorno = [new THREE.Color('#ffb38a'), new THREE.Color('#5a7bd8')], cieloNotte = [new THREE.Color('#2a1a4a'), new THREE.Color('#05060f')];
const cielo = new THREE.Mesh(new THREE.SphereGeometry(300, 32, 16), new THREE.ShaderMaterial({ side: THREE.BackSide, depthWrite: false,
  uniforms: { basso: { value: cieloGiorno[0].clone() }, alto: { value: cieloGiorno[1].clone() } },
  vertexShader: 'varying vec3 p; void main(){ p = normalize(position); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }',
  fragmentShader: 'uniform vec3 basso; uniform vec3 alto; varying vec3 p; void main(){ float t = smoothstep(-0.05,0.6,p.y); gl_FragColor = vec4(mix(basso,alto,t),1.); }' }));
scena.add(cielo);
scena.fog = new THREE.Fog('#c99a9a', 60, 170);
const emisfero = new THREE.HemisphereLight('#ffe3c4', '#2a3550', 1.1); scena.add(emisfero);
const sole = new THREE.DirectionalLight('#fff1d6', 2.4); sole.position.set(40, 60, 25); sole.castShadow = true;
sole.shadow.mapSize.set(2048, 2048); Object.assign(sole.shadow.camera, { left: -40, right: 40, top: 40, bottom: -40, near: 1, far: 160 }); sole.shadow.bias = -0.0005;
scena.add(sole, sole.target);

// ---------- terreno
const R_ISOLA = 52;
const zone = M.zone.map(z => ({ ...z, aperta: giorno >= z.giorno }));
function altezza(x, z) {
  const d = Math.hypot(x, z) / R_ISOLA;
  let h = (noise(x * 0.06, z * 0.06) * 3.2 + noise(x * 0.18, z * 0.18) * 0.9) * (1 - d * d) + 1.6 - Math.pow(d, 3) * 7.5;
  for (const zn of zone) { const dz = Math.hypot(x - zn.cx, z - zn.cz) / zn.r;
    if (zn.tipo === 'picco' && dz < 1) h += Math.pow(1 - dz, 1.6) * 16;
    if (zn.tipo === 'palude' && dz < 1) h = h * (0.4 + 0.6 * dz) + (1 - dz) * 0.3;
    if (zn.tipo === 'citta' && dz < 1) h = h + (2.2 - h) * Math.min(1, (1 - dz) * 2.5); }
  return h;
}
function zonaIn(x, z) { return zone.find(zn => Math.hypot(x - zn.cx, z - zn.cz) < zn.r * 0.92); }
{
  const g = new THREE.PlaneGeometry(130, 130, 150, 150); g.rotateX(-Math.PI / 2);
  const pos = g.attributes.position, col = [];
  const c = new THREE.Color();
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i), h = altezza(x, z); pos.setY(i, h);
    const zn = zonaIn(x, z);
    if (h < 0.5) c.set('#e8cf98'); else if (zn?.tipo === 'palude') c.set('#3c5a3a').lerp(new THREE.Color('#2b3d33'), noise(x * .3, z * .3));
    else if (zn?.tipo === 'citta') c.set('#5b5f73'); else if (zn?.tipo === 'picco' && h > 9) c.set('#f4f1ec'); else if (h > 7) c.set('#8b8f7a');
    else c.set('#5fae5a').lerp(new THREE.Color('#3f8a4c'), noise(x * .15 + 9, z * .15));
    col.push(c.r, c.g, c.b);
  }
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3)); g.computeVertexNormals();
  const terra = new THREE.Mesh(g.toNonIndexed(), new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: .95 }));
  terra.geometry.computeVertexNormals(); terra.receiveShadow = true; scena.add(terra);
}
const acqua = new THREE.Mesh(new THREE.CircleGeometry(220, 64), new THREE.MeshStandardMaterial({ color: '#2f8fc0', transparent: true, opacity: .82, roughness: .15, metalness: .1 }));
acqua.rotation.x = -Math.PI / 2; acqua.position.y = 0.15; scena.add(acqua);

// ---------- vegetazione e dettagli (instanced)
const r0 = rng('isola');
const dummy = new THREE.Object3D();
function sparpaglia(n, filtro) { const out = []; let k = 0; while (out.length < n && k++ < n * 40) { const a = r0() * Math.PI * 2, d = Math.sqrt(r0()) * 48, x = Math.cos(a) * d, z = Math.sin(a) * d, h = altezza(x, z); if (h > 0.8 && filtro(x, z, h)) out.push([x, z, h]); } return out; }
const liberi = [[0, 10, 13], ...(M.costruzioni || []).map(c => [c.x, c.z, 6 * (c.scala || 1)]), ...(M.personaggi || []).map(c => [c.x, c.z, 3]), ...(M.cartelli || []).map(c => [c.x, c.z, 2.5])];
const alberi = sparpaglia(120, (x, z, h) => { const zn = zonaIn(x, z); return h < 7 && zn?.tipo !== 'citta' && liberi.every(([a, b, r]) => Math.hypot(x - a, z - b) > r); });
const chiome = new THREE.InstancedMesh(new THREE.ConeGeometry(1.4, 3.6, 7), new THREE.MeshStandardMaterial({ color: '#2f7d4a', flatShading: true }), alberi.length);
const tronchi = new THREE.InstancedMesh(new THREE.CylinderGeometry(.22, .3, 1.4, 6), new THREE.MeshStandardMaterial({ color: '#6b4a35', flatShading: true }), alberi.length);
alberi.forEach(([x, z, h], i) => { const s = .55 + r0() * .5; dummy.position.set(x, h + .7 * s, z); dummy.scale.setScalar(s); dummy.rotation.y = r0() * 6; dummy.updateMatrix(); tronchi.setMatrixAt(i, dummy.matrix);
  dummy.position.y = h + 2.6 * s; dummy.updateMatrix(); chiome.setMatrixAt(i, dummy.matrix);
  if (zonaIn(x, z)?.tipo === 'palude') chiome.setColorAt(i, new THREE.Color('#4b6b3a')); else chiome.setColorAt(i, new THREE.Color().setHSL(.33 + r0() * .06, .45, .3 + r0() * .1)); });
chiome.castShadow = tronchi.castShadow = true; scena.add(chiome, tronchi);
const rocce = sparpaglia(70, () => true);
const rocciaMesh = new THREE.InstancedMesh(new THREE.DodecahedronGeometry(.8, 0), new THREE.MeshStandardMaterial({ color: '#8d8a96', flatShading: true }), rocce.length);
rocce.forEach(([x, z, h], i) => { dummy.position.set(x, h + .2, z); dummy.scale.set(.6 + r0(), .4 + r0() * .6, .6 + r0()); dummy.rotation.set(r0(), r0() * 6, 0); dummy.updateMatrix(); rocciaMesh.setMatrixAt(i, dummy.matrix); });
rocciaMesh.castShadow = true; scena.add(rocciaMesh);

// città dei server: torri con luci che pulsano
const luciServer = [];
for (const zn of zone.filter(z => z.tipo === 'citta')) {
  const rr = rng('citta');
  for (let i = 0; i < 16; i++) { const a = rr() * Math.PI * 2, d = 3 + rr() * (zn.r - 5), x = zn.cx + Math.cos(a) * d, z = zn.cz + Math.sin(a) * d, hh = 3 + rr() * 7;
    const torre = new THREE.Mesh(new THREE.BoxGeometry(2.2, hh, 2.2), new THREE.MeshStandardMaterial({ color: '#2a2d3e', roughness: .6, metalness: .4 }));
    torre.position.set(x, altezza(x, z) + hh / 2, z); torre.castShadow = true; scena.add(torre);
    for (let k = 0; k < Math.floor(hh / 1.2); k++) { const l = new THREE.Mesh(new THREE.BoxGeometry(2.25, .12, 2.25), new THREE.MeshStandardMaterial({ color: '#000', emissive: rr() > .5 ? '#39d98a' : '#5ab0ff', emissiveIntensity: 1 }));
      l.position.set(x, altezza(x, z) + .8 + k * 1.2, z); scena.add(l); luciServer.push([l, rr() * 6]); } }
}
// lucciole/bug nella palude
const lucciole = [];
for (const zn of zone.filter(z => z.tipo === 'palude')) { const rr = rng('bug'); for (let i = 0; i < 40; i++) { const m = new THREE.Mesh(new THREE.SphereGeometry(.09, 6, 6), new THREE.MeshBasicMaterial({ color: '#c6ff6b' }));
  const x = zn.cx + (rr() - .5) * zn.r * 1.6, z = zn.cz + (rr() - .5) * zn.r * 1.6; m.position.set(x, altezza(x, z) + 1 + rr() * 2, z); m.userData = { b: m.position.clone(), f: rr() * 6 }; scena.add(m); lucciole.push(m); } }

// cupole delle zone chiuse
const cupole = [];
for (const zn of zone.filter(z => !z.aperta)) {
  const cup = new THREE.Mesh(new THREE.SphereGeometry(zn.r, 40, 20, 0, Math.PI * 2, 0, Math.PI / 2), new THREE.ShaderMaterial({ transparent: true, depthWrite: false, side: THREE.DoubleSide,
    uniforms: { t: { value: 0 }, col: { value: new THREE.Color('#ff5a3c') } },
    vertexShader: 'varying vec3 p; varying vec3 n; void main(){ p = position; n = normalMatrix*normal; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }',
    fragmentShader: 'uniform float t; uniform vec3 col; varying vec3 p; varying vec3 n; void main(){ float bordo = 1.-abs(dot(normalize(n),vec3(0.,0.,1.))); float righe = step(.92, fract(p.y*1.2 - t*.6)); float esa = step(.95, fract(atan(p.z,p.x)*6.)); gl_FragColor = vec4(col, .08 + bordo*.35 + righe*.25 + esa*.15); }' }));
  cup.position.set(zn.cx, altezza(zn.cx, zn.cz) - 3, zn.cz); scena.add(cup); cupole.push(cup);
  const et = etichetta(`🔒 ${zn.nome}`, `si apre al giorno ${zn.giorno}`, '#ff5a3c'); et.position.set(zn.cx, altezza(zn.cx, zn.cz) + zn.r * .75, zn.cz); et.scale.multiplyScalar(2.2); scena.add(et);
}

// ---------- etichette (sprite con testo)
function etichetta(titolo, sotto = '', colore = '#ffd84a') {
  const cv = document.createElement('canvas'), W = 512, H = sotto ? 150 : 96; cv.width = W; cv.height = H; const x = cv.getContext('2d');
  x.fillStyle = 'rgba(14,14,26,.78)'; x.beginPath(); x.roundRect(4, 4, W - 8, H - 8, 28); x.fill();
  x.font = '700 46px SG, system-ui'; x.textAlign = 'center'; x.fillStyle = colore; x.fillText(titolo, W / 2, 62, W - 30);
  if (sotto) { x.font = '500 32px system-ui'; x.fillStyle = '#d6d9e0'; x.fillText(sotto, W / 2, 112, W - 30); }
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(cv), depthWrite: false, transparent: true, fog: false }));
  sp.material.map.colorSpace = THREE.SRGBColorSpace; sp.scale.set(W / 120, H / 120, 1); return sp;
}

// ---------- robot (giocatore e personaggi)
const OCCHI = { gialli: '#ffd84a', menta: '#39d98a', rossi: '#ff5a3c', blu: '#5ab0ff', rosa: '#ff7ad9' };
function robot({ colore = '#f2f0ea', testa = 'antenna', occhi = 'gialli', nome = '' } = {}) {
  const g = new THREE.Group(), mat = new THREE.MeshStandardMaterial({ color: colore, roughness: .4, metalness: .05 });
  const corpo = new THREE.Mesh(new THREE.BoxGeometry(1.3, 1.2, 1.1), mat); corpo.position.y = 1.15; corpo.castShadow = true; g.add(corpo);
  const viso = new THREE.Mesh(new THREE.BoxGeometry(1.05, .62, .05), new THREE.MeshStandardMaterial({ color: '#12101f', roughness: .2 })); viso.position.set(0, 1.28, .56); g.add(viso);
  const matOcchi = new THREE.MeshStandardMaterial({ color: '#000', emissive: OCCHI[occhi] || occhi, emissiveIntensity: 2 });
  const occhiG = new THREE.Group(); for (const s of [-1, 1]) { const o = new THREE.Mesh(new THREE.BoxGeometry(.2, .2, .04), matOcchi); o.position.set(s * .24, 1.3, .6); occhiG.add(o); } g.add(occhiG);
  const cuore = new THREE.Mesh(new THREE.BoxGeometry(.5, .06, .04), new THREE.MeshStandardMaterial({ color: '#000', emissive: '#ff5a3c', emissiveIntensity: 2 })); cuore.position.set(0, .82, .57); g.add(cuore);
  const gambe = []; for (const s of [-1, 1]) { const l = new THREE.Mesh(new THREE.BoxGeometry(.32, .6, .36), new THREE.MeshStandardMaterial({ color: '#2a2a3e' })); l.position.set(s * .32, .3, 0); l.castShadow = true; g.add(l); gambe.push(l); }
  const accent = new THREE.MeshStandardMaterial({ color: '#ff5a3c', emissive: '#ff5a3c', emissiveIntensity: .6 });
  if (testa === 'antenna') { const a = new THREE.Mesh(new THREE.CylinderGeometry(.04, .04, .5), mat); a.position.y = 2; const p = new THREE.Mesh(new THREE.SphereGeometry(.13, 12, 12), accent); p.position.y = 2.3; g.add(a, p); }
  if (testa === 'cappello') { const b = new THREE.Mesh(new THREE.CylinderGeometry(.75, .75, .06, 20), new THREE.MeshStandardMaterial({ color: '#1b1b28' })); b.position.y = 1.78; const t = new THREE.Mesh(new THREE.CylinderGeometry(.45, .48, .55, 20), b.material); t.position.y = 2.06; const f = new THREE.Mesh(new THREE.CylinderGeometry(.49, .49, .1, 20), accent); f.position.y = 1.86; g.add(b, t, f); }
  if (testa === 'corna') for (const s of [-1, 1]) { const c = new THREE.Mesh(new THREE.ConeGeometry(.14, .5, 8), accent); c.position.set(s * .45, 1.98, 0); c.rotation.z = -s * .4; g.add(c); }
  if (testa === 'aureola') { const a = new THREE.Mesh(new THREE.TorusGeometry(.42, .06, 8, 28), new THREE.MeshStandardMaterial({ color: '#000', emissive: '#ffd84a', emissiveIntensity: 2 })); a.rotation.x = Math.PI / 2; a.position.y = 2.2; g.add(a); }
  if (testa === 'corona') { const c = new THREE.Mesh(new THREE.CylinderGeometry(.5, .45, .35, 8, 1, true), new THREE.MeshStandardMaterial({ color: '#ffd84a', metalness: .8, roughness: .25, side: THREE.DoubleSide })); c.position.y = 1.94; g.add(c); }
  if (nome) { const e = etichetta(nome, '', '#ffffff'); e.position.y = 2.9; e.scale.multiplyScalar(.55); g.add(e); }
  g.userData = { gambe, occhiG, cuore, corpo };
  return g;
}

// ---------- contenuti dal JSON

      if (Math.hypot(c.position.x - pg.x, c.position.z - pg.z) < 1.6 && Math.abs(c.position.y - (pg.y + 1)) < 2.2) { scena.remove(c); celle.splice(celle.indexOf(c), 1); avviso(`+1 ⚡`, 500); } }
    if (!celle.length) fineSfida(true); else if (resta <= 0) fineSfida(false); }
  renderer.render(scena, camera);
  requestAnimationFrame(ciclo);
}
