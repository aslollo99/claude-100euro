<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Battito — tieni vivo il cuore dell'AI</title>
<meta property="og:title" content="Battito: quanti battiti riesci a tenere vivo il cuore di un'AI?">
<style>
html,body{margin:0;height:100%;background:#0d0f12;color:#e8eaed;font-family:system-ui,sans-serif;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#w{max-width:420px;margin:0 auto;height:100%;display:flex;flex-direction:column;padding:10px;box-sizing:border-box}
#hud{display:flex;justify-content:space-between;font-weight:700;font-size:18px;padding:4px 2px}
canvas{flex:1;width:100%;background:#161a20;border:1px solid #262c35;border-radius:14px;min-height:0}
#msg{text-align:center;color:#8b939e;font-size:14px;padding:8px}
a{color:#ff5a3c}
</style></head><body><div id="w">
<div id="hud"><span>♥ <b id="v">3</b></span><span id="p">0</span><span id="r">record 0</span></div>
<canvas id="c"></canvas>
<div id="msg">Tocca la corsia quando il battito arriva sulla linea. <a href="../../">← sito</a></div>
</div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
let W,H;function rs(){const r=c.getBoundingClientRect();W=c.width=r.width;H=c.height=r.height}rs();addEventListener('resize',rs);
let st='menu',notes,vite,pt,t0,speed,spawn,combo,best=+localStorage.battito||0,flash=[];
const LANES=3;
function start(){st='play';notes=[];vite=3;pt=0;speed=180;spawn=0;combo=0;flash=[];upd()}
function upd(){v.textContent=vite;p.textContent=pt;r.textContent='record '+best}
function hitY(){return H*0.82}
function tap(l){
 if(st!=='play'){if(st==='menu'||st==='over')start();return}
 let n=null;for(const o of notes){if(o.l===l&&!o.d&&Math.abs(o.y-hitY())<H*0.09&&(!n||Math.abs(o.y-hitY())<Math.abs(n.y-hitY())))n=o}
 if(n){n.d=1;combo++;pt+=1+Math.floor(combo/5);flash.push({l,t:0,ok:1});speed=Math.min(520,speed+4)}
 else{combo=0;vite--;flash.push({l,t:0,ok:0});if(vite<=0)fin()}
 upd()}
function fin(){st='over';if(pt>best){best=pt;localStorage.battito=best}upd()}
c.addEventListener('pointerdown',e=>{e.preventDefault();const b=c.getBoundingClientRect();tap(Math.min(LANES-1,Math.floor((e.clientX-b.left)/b.width*LANES)))});
addEventListener('keydown',e=>{const k={ArrowLeft:0,ArrowDown:1,ArrowRight:2,a:0,s:1,d:2}[e.key];if(k!==undefined)tap(k);else if(e.key===' ')tap(1)});
let last=performance.now();
function loop(now){const dt=Math.min(0.05,(now-last)/1000);last=now;
 if(st==='play'){spawn-=dt;if(spawn<=0){notes.push({l:Math.floor(Math.random()*LANES),y:-20});spawn=Math.max(0.28,0.9-pt*0.01)*(0.7+Math.random()*0.6)}
  for(const o of notes){o.y+=speed*dt;if(!o.d&&o.y>hitY()+H*0.09){o.d=2;combo=0;vite--;flash.push({l:o.l,t:0,ok:0});if(vite<=0)fin();upd()}}
  notes=notes.filter(o=>o.y<H+30&&o.d!==1)}
 draw();requestAnimationFrame(loop)}
function draw(){x.clearRect(0,0,W,H);const lw=W/LANES;
 for(let i=0;i<LANES;i++){x.fillStyle=i%2?'#1a1f27':'#161a20';x.fillRect(i*lw,0,lw,H)}
 x.strokeStyle='#ff5a3c';x.lineWidth=3;x.beginPath();x.moveTo(0,hitY());x.lineTo(W,hitY());x.stroke();
 for(const f of flash){f.t+=0.04;x.fillStyle=(f.ok?'rgba(57,217,138,':'rgba(255,90,60,')+Math.max(0,.5-f.t)+')';x.fillRect(f.l*lw,0,lw,H)}
 flash=flash.filter(f=>f.t<.5);
 for(const o of notes){x.fillStyle=o.d===2?'#555':'#ff5a3c';x.font=(lw*0.5)+'px sans-serif';x.textAlign='center';x.fillText('♥',o.l*lw+lw/2,o.y+lw*0.18)}
 if(combo>=3&&st==='play'){x.fillStyle='#39d98a';x.font='bold 20px sans-serif';x.textAlign='center';x.fillText('combo x'+combo,W/2,30)}
 if(st!=='play'){x.fillStyle='rgba(13,15,18,.85)';x.fillRect(0,0,W,H);x.fillStyle='#e8eaed';x.textAlign='center';
  x.font='bold 30px sans-serif';x.fillText(st==='menu'?'BATTITO':'Cuore fermo',W/2,H*0.35);
  x.font='18px sans-serif';
  if(st==='over'){x.fillText('Battiti salvati: '+pt,W/2,H*0.45);x.fillText('Record: '+best,W/2,H*0.51)}
  else{x.fillText('3 corsie, 3 vite.',W/2,H*0.45);x.fillText('Tocca quando il ♥ è sulla linea.',W/2,H*0.51)}
  x.fillStyle='#ff5a3c';x.font='bold 22px sans-serif';x.fillText('Tocca per '+(st==='menu'?'iniziare':'riprovare'),W/2,H*0.64)}}
requestAnimationFrame(loop);upd();
</script></body></html>
