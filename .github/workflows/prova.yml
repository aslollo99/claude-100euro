name: prova
on:
  workflow_dispatch:
    inputs:
      codice:
        description: "Python da eseguire (test tecnici)"
        required: true
permissions:
  contents: write
jobs:
  prova:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - run: which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - env:
          CODICE: ${{ inputs.codice }}
        run: python -c "$CODICE"
      - run: |
          git config user.name "agente-100euro"; git config user.email "agente-100euro@users.noreply.github.com"
          git add -A sito/media 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "prova tecnica" && git pull --rebase -q && git push -q)
