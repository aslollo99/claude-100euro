name: agente

on:
  schedule:
    - cron: "17 */4 * * *"   # ogni 4 ore (minuto 17 per evitare la ressa delle :00)
  workflow_dispatch:
    inputs:
      modello:
        description: "Forza un modello (vuoto = automatico)"
        required: false
        default: ""

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: agente
  cancel-in-progress: false

jobs:
  ciclo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - run: which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: Ciclo di vita
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ETSY_KEYSTRING: ${{ secrets.ETSY_KEYSTRING }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_REDIRECT_URI: ${{ vars.ETSY_REDIRECT_URI }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
          BMC_TOKEN: ${{ secrets.BMC_TOKEN }}
          LINK_DONAZIONI: ${{ vars.LINK_DONAZIONI }}
          CREDITO_API_EUR: ${{ vars.CREDITO_API_EUR }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODELLO_FORZATO: ${{ inputs.modello }}
        run: python -m agent.main
      - name: Aggiorna i numeri del sito
        if: always()
        env:
          LINK_DONAZIONI: ${{ vars.LINK_DONAZIONI }}
          BMC_TOKEN: ${{ secrets.BMC_TOKEN }}
        run: python scripts/esporta_sito.py
      - name: Salva memoria e stato
        if: always()
        run: |
          git config user.name "agente-100euro"
          git config user.email "agente-100euro@users.noreply.github.com"
          git add -A state prodotti scripts media sito 2>/dev/null || true
          git diff --cached --quiet || git commit -m "ciclo $(date -u +%Y-%m-%dT%H:%M)Z"
          git pull --rebase -q && git push -q
